name: Build appui

run-name: "appui @ ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }} (${{ github.event.inputs.target || github.event.client_payload.target || 'apk' }})"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch / tag / commit SHA trên git.techshield.vn/OnTour/app-ui
        required: true
        default: main
      target:
        description: "Output: apk | appbundle (Android) | ios (unsigned .ipa) | all (apk + ios)"
        type: choice
        options: [apk, appbundle, ios, all]
        default: apk
  repository_dispatch:
    types: [build-appui]

permissions: {}

concurrency:
  group: build-appui-${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}-${{ github.event.inputs.target || github.event.client_payload.target || 'apk' }}
  cancel-in-progress: true

env:
  SOURCE_URL: https://git.techshield.vn/OnTour/app-ui.git
  FLUTTER_VERSION: 3.44.8
  RETENTION_DAYS: 7

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event.inputs.target || github.event.client_payload.target) == 'all' && '["apk","ios"]' || format('["{0}"]', github.event.inputs.target || github.event.client_payload.target || 'apk')) }}
    env:
      REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Validate inputs & secrets
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for s in GITEA_USERNAME GITEA_TOKEN ARTIFACT_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "::error::Thiếu secret $s"; missing=1; fi
          done
          if [ "${#ARTIFACT_PASSWORD}" -lt 16 ]; then echo "::error::ARTIFACT_PASSWORD phải >= 16 ký tự"; missing=1; fi
          case "$TARGET" in apk|appbundle|ios) ;; *) echo "::error::target không hợp lệ"; missing=1 ;; esac
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "::error::ref không hợp lệ"; missing=1; fi
          exit $missing

      - name: Fetch private source
        id: src
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf '%s:%s' "$GITEA_USERNAME" "$GITEA_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git init -q src
          cd src
          git -c http.extraHeader="Authorization: Basic $auth" \
            fetch -q --depth 1 --no-tags "$SOURCE_URL" "$REF"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: matrix.target != 'ios'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Toàn bộ output build (có thể chứa đoạn source khi lỗi compile) chỉ ghi vào file,
      # file này nằm trong archive mã hoá — log public chỉ hiện pass/fail.
      - name: Build (output hidden)
        id: build
        working-directory: src
        run: |
          set +e -uo pipefail
          mkdir -p ../out/symbols
          flutter config --no-analytics --no-cli-animations > /dev/null 2>&1 || true
          common=(--release --build-number "$GITHUB_RUN_NUMBER" --obfuscate --split-debug-info=../out/symbols)
          {
            flutter --version
            [ "$TARGET" = ios ] && xcodebuild -version
            flutter pub get
            if [ "$TARGET" = ios ]; then
              flutter build ios --no-codesign "${common[@]}"
            else
              flutter build "$TARGET" "${common[@]}"
            fi
          } > ../out/build.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $rc -eq 0 ]; then echo "Build OK"; else echo "::error::Build failed (exit $rc) — xem build.log trong artifact mã hoá"; fi

      - name: Package & encrypt
        if: always() && steps.src.outcome == 'success'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in src/build/app/outputs/flutter-apk/app-release.apk src/build/app/outputs/bundle/release/*.aab; do
            cp "$f" out/
          done
          if [ -d src/build/ios/iphoneos/Runner.app ]; then
            mkdir -p ipa/Payload
            cp -R src/build/ios/iphoneos/Runner.app ipa/Payload/
            (cd ipa && zip -qry ../out/appui-unsigned.ipa Payload)
          fi
          if command -v 7z > /dev/null; then Z=7z
          elif command -v 7zz > /dev/null; then Z=7zz
          else brew install -q sevenzip > /dev/null; Z=7zz; fi
          name="appui-${SHA}-${TARGET}-${GITHUB_RUN_NUMBER}"
          "$Z" a -t7z -mhe=on -mx=5 -p"$ARTIFACT_PASSWORD" "${name}.7z" ./out/* > /dev/null
          echo "ARCHIVE=${name}" >> "$GITHUB_ENV"
          rm -rf src out ipa

      - name: Upload encrypted artifact
        if: always() && env.ARCHIVE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.7z
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          SHA: ${{ steps.src.outputs.sha }}
          RC: ${{ steps.build.outputs.rc }}
        run: |
          {
            echo "### appui build — $TARGET"
            echo "| ref | commit | target | result |"
            echo "|---|---|---|---|"
            echo "| \`$REF\` | \`${SHA:-?}\` | $TARGET | $([ "${RC:-1}" = 0 ] && echo ✅ || echo ❌) |"
            echo
            echo "Artifact mã hoá AES-256 (7z, ẩn cả tên file). Giải nén: \`7z x <file>.7z -p<ARTIFACT_PASSWORD>\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${RC:-1}" = 0 ]
